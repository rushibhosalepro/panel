services:
  - type: web
    name: panel
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-4.5
      - key: OPENROUTER_KEY
        sync: false
